[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueflora-backend"
version = "0.1.0"
description = "Base modular de la API propia de BlueFlora"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "SQLAlchemy>=2.0.44,<2.2",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2.10,<4",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requiere PostgreSQL blueflora_test configurado explícitamente"]
